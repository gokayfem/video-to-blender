name: checks

on:
  push:
    branches: [main]
  pull_request:

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"
  # From https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
  BLENDER_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"

jobs:
  static:
    name: index, static rules, eval suite format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Library index is up to date
        run: python3 skills/procedural-blender-nodes/scripts/nodes_tools.py index --check
      - name: Static library rules (names, summaries, uses, module order)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "skills/procedural-blender-nodes/scripts")
          import nodes_tools
          problems = nodes_tools.static_check()
          for p in problems:
              print("ERROR", p)
          print(f"static: {len(problems)} problem(s)")
          sys.exit(1 if problems else 0)
          PY
      - name: Eval suite matches the plugin-eval format
        run: python3 tests/check_evals.py

  blender:
    name: Blender build, lint, evaluation, property tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blender's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 \
            libgl1 libegl1 libgl1-mesa-dri
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          name="blender-${BLENDER_VERSION}-linux-x64"
          curl -fsSL -o "/tmp/$name.tar.xz" \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/$name.tar.xz"
          echo "${BLENDER_SHA256}  /tmp/$name.tar.xz" | sha256sum -c -
          mkdir -p ~/blender
          tar -xJf "/tmp/$name.tar.xz" -C ~/blender
      - name: Put Blender on PATH
        run: |
          dir="$HOME/blender/blender-${BLENDER_VERSION}-linux-x64"
          echo "BLENDER=$dir/blender" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/blender" --version
      - name: Static rules, then build, lint and evaluate every group
        run: python3 skills/procedural-blender-nodes/scripts/nodes_tools.py check
      - name: Property tests
        run: python3 skills/procedural-blender-nodes/scripts/nodes_tools.py test
      - name: Templates build and the gallery is up to date
        run: |
          if [ -f tests/build_gallery.py ]; then
            python3 tests/build_gallery.py --check
          else
            echo "tests/build_gallery.py does not exist yet; skipping"
          fi
